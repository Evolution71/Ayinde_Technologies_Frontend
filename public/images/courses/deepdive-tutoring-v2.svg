<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tutor_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fa709a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fee140;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow3">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="200" height="200" fill="url(#tutor_grad)"/>

  <!-- Background circles -->
  <circle cx="30" cy="170" r="45" fill="white" opacity="0.08"/>
  <circle cx="170" cy="30" r="55" fill="white" opacity="0.08"/>

  <!-- Tutor (left person) -->
  <g filter="url(#shadow3)">
    <!-- Head -->
    <circle cx="55" cy="55" r="13" fill="white" opacity="0.95"/>
    <!-- Smile -->
    <path d="M 50 60 Q 55 63 60 60" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Eyes -->
    <circle cx="51" cy="52" r="1.5" fill="#fa709a"/>
    <circle cx="59" cy="52" r="1.5" fill="#fa709a"/>
    <!-- Body -->
    <rect x="48" y="70" width="14" height="28" rx="3" fill="white" opacity="0.9"/>
    <!-- Arms -->
    <line x1="48" y1="78" x2="30" y2="88" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    <line x1="62" y1="78" x2="80" y2="88" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- Student (right person) -->
  <g filter="url(#shadow3)">
    <!-- Head -->
    <circle cx="145" cy="55" r="13" fill="white" opacity="0.95"/>
    <!-- Smile -->
    <path d="M 140 60 Q 145 63 150 60" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Eyes -->
    <circle cx="141" cy="52" r="1.5" fill="#fee140"/>
    <circle cx="149" cy="52" r="1.5" fill="#fee140"/>
    <!-- Body -->
    <rect x="138" y="70" width="14" height="28" rx="3" fill="white" opacity="0.9"/>
    <!-- Arms -->
    <line x1="138" y1="78" x2="120" y2="88" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    <line x1="152" y1="78" x2="170" y2="88" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- Connection arrow -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="white"/>
    </marker>
  </defs>
  <line x1="70" y1="105" x2="130" y2="105" stroke="white" stroke-width="3" opacity="0.75" stroke-dasharray="4,3" marker-end="url(#arrowhead)"/>

  <!-- Lightbulb (knowledge) -->
  <g transform="translate(100, 145)">
    <!-- Bulb -->
    <circle cx="0" cy="-10" r="10" fill="white" opacity="0.9"/>
    <!-- Filament -->
    <path d="M -2 -10 Q 0 -5 2 -10" stroke="white" stroke-width="1.5" fill="none" opacity="0.6"/>
    <!-- Base -->
    <rect x="-3" y="2" width="6" height="5" rx="1" fill="white" opacity="0.85"/>
    <!-- Light rays -->
    <line x1="0" y1="-22" x2="0" y2="-28" stroke="white" stroke-width="2" opacity="0.7" stroke-linecap="round"/>
    <line x1="16" y1="-8" x2="22" y2="-14" stroke="white" stroke-width="2" opacity="0.7" stroke-linecap="round"/>
    <line x1="-16" y1="-8" x2="-22" y2="-14" stroke="white" stroke-width="2" opacity="0.7" stroke-linecap="round"/>
  </g>
</svg>