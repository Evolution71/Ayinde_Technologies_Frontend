<svg viewBox="0 0 480 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract network illustration">
  <defs>
    <linearGradient id="heroLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#378ADD"/>
      <stop offset="100%" stop-color="#0F6E56"/>
    </linearGradient>
    <radialGradient id="heroGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#378ADD" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#378ADD" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="240" cy="200" r="180" fill="url(#heroGlow)"/>

  <!-- connecting lines -->
  <g stroke="url(#heroLine)" stroke-width="2" opacity="0.85">
    <line x1="90" y1="280" x2="200" y2="150"/>
    <line x1="200" y1="150" x2="330" y2="200"/>
    <line x1="330" y1="200" x2="410" y2="110"/>
    <line x1="200" y1="150" x2="150" y2="90"/>
    <line x1="330" y1="200" x2="300" y2="300"/>
  </g>

  <!-- nodes -->
  <circle cx="90" cy="280" r="10" fill="#185FA5"/>
  <circle cx="200" cy="150" r="13" fill="#378ADD"/>
  <circle cx="150" cy="90" r="8" fill="#0F6E56"/>
  <circle cx="330" cy="200" r="13" fill="#378ADD"/>
  <circle cx="300" cy="300" r="8" fill="#0F6E56"/>
  <circle cx="410" cy="110" r="12" fill="#D85A30"/>

  <!-- orbit ring accent -->
  <circle cx="240" cy="200" r="150" fill="none" stroke="#378ADD" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="4 8"/>
</svg>
